version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: activerecordjs
      POSTGRES_PASSWORD: activerecordjs
      POSTGRES_DB: activerecordjs_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U activerecordjs -d activerecordjs_test']
      interval: 5s
      timeout: 5s
      retries: 5
